gseq____&quot;,1059,536870969]],[logseq____&quot;^15logseq____&quot;,[1062,logseq____&quot;^Ulogseq____&quot;,41,536870969]],[logseq____&quot;^15logseq____&quot;,[1062,logseq____&quot;^Ulogseq____&quot;,1043,536870969]],[logseq____&quot;^15logseq____&quot;,[1062,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8734e1-49d5-4faf-9f3d-5337a468fde4logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1063,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 22 - The four pillars of platform engineering are intended to tackle complexity, rather than passing the buck to another system or team.\\n\\n---\\n\\nThe curated product approach is the sweet spot between a curated approach and the product approach. Without a curation focus, we end up with great customer service without a coherent strategy. Without a product focus, the offerings (services, platform, etc) become rigid and might not fit user needs\\n\\n---\\n\\nPaved paths are a type of platform pattern which builds out opinionated platforms that cover most uses cases. Outlier cases are excluded/not supported. The goal with paved paths is to hide complexity behind the platform so app devs don’t need to worry about integrating in multi-system ecosystems.logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1063,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1063,logseq____&quot;^Flogseq____&quot;,1068,536870969]],[logseq____&quot;^15logseq____&quot;,[1063,logseq____&quot;^Xlogseq____&quot;,41,536870969]],[logseq____&quot;^15logseq____&quot;,[1063,logseq____&quot;^Vlogseq____&quot;,1059,536870969]],[logseq____&quot;^15logseq____&quot;,[1063,logseq____&quot;^Ulogseq____&quot;,41,536870969]],[logseq____&quot;^15logseq____&quot;,[1063,logseq____&quot;^Ulogseq____&quot;,1043,536870969]],[logseq____&quot;^15logseq____&quot;,[1063,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8734e1-ee91-4b6a-83ea-a122c7c51ef5lo ogseq____&quot;,logseq____&quot;pg 52-53 - Don’t hire product managers until the team is well established, and don’t hire projects managers for even longer. It’s preemptive until you actually deliver values.\\n\\nRule of thumb for both: the number of product managers should be between the number of team managers and the number of skip managers. Project managers should be about one for every 50 members of a team.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Flogseq____&quot;,1087,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Vlogseq____&quot;,1092,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8734e1-29b7-4478-8582-7965dbc5f7e6logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;[[Notes]]logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Flogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Vlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Hlogseq____  <script type="text/javascript">// Single Page Apps for GitHub Pages

      // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
