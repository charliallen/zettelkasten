_&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1066,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1066,logseq____&quot;^Flogseq____&quot;,1059,536870969]],[logseq____&quot;^15logseq____&quot;,[1066,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1066,logseq____&quot;^Vlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1066,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1066,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1066,logseq____&quot;^Hlogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1066,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-8acc-43a3-841b-98cea587b146logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1067,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 24 - Platform engineering initiatives need to involve software engineers from the get-go. If no one can build the platform to abstract details away, then you’ve just created infrastructure vending with extra stepslogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1067,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1067,logseq____&quot;^Flogseq____&quot;,1070,536870969]],[logseq____&quot;^15logseq____&quot;,[1067,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1067,logseq____&quot;^Vlogseq____&quot;,1066,536870969]],[logseq____&quot;^15logseq____&quot;,[1067,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1067,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1067,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-99d4-48c4-a5d8-0de179d1d743logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 29 - Self-service is a key part of a platform. This especially means that onboarding must be seamless as possible. The best platforms have sane defaults for a novice, and the ability to empower expertslogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Flogseq____&quot;,1062,536870969]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Vlogseq____&quot;,1066,536870969]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-134e-4b3a-aca4-cc4784869fa8logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 22 - The four pillars of platform engineering are intended to tackle complexity, rather than passing the buck to another system or team.\\n\\n---\\n\\nThe curated product approach is the sweet spot between a curated approach and the product approach. Without a curation focus, we end up with great customer service without a coherent strategy. Without a product focus, the offerings (services, platform, etc) become rigid and might not fit user needs\\n\\n---\\n\\nPaved paths are a type of platform pattern which builds out opinionated platforms that cover most uses cases. Outlier cases are excluded/not supported. The goal with paved paths is to hide complexity behind the platform so app devs don’t need to worry about integrating in multi-system ecosystems.logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Flogseq____&quot;,1067,536870969]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Vlogseq____&quot;,1066,536870969]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-021d-447f-9d80-65e8722eb225logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 24 - Platform engineering is about finding every way to make your customers’ lives easier. If you can take work off their plate, even better. The customers’ needs must always be the first thing in mind at all times\\n\\n---\\n\\nPlatform engineering should only be done when there’s a need. If existing tools work and no code is required, then there’s no need for a platform yet.logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Flogseq____&quot;,1060,536870969]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Vlogseq____&quot;,1066,536870969]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-9b56-4a54-a8d9-bb3ed697f71elogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 31 - Platforms are foundations for application developers, and need to be functional and available. Flaky systems result in users needing to become experts on the platformlogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Flogseq____&quot;,1074,536870969]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Vlogseq____&quot;,1066,536870969]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-8e1d-4719-a7f5-af92db69e60blogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 27 - Each platform primitive requires documentation and records, such as ownership, cost efficiency, or other use caseslogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Flogseq____&quot;,1075,536870969]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Vlogseq____&quot;,1066,536870969]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-cab6-4c43-bcab-7d5d85f5b256logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1073,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 33 - Platform engineering teams are on the hook for user support regarding the platform, and should expect frequent questions and requests for help\\n\\n---\\n\\nPlatform teams must be proactive about abiding with operation discipline and best practices.\\n\\nWhat does “operation disciple” mean? According to the book, “Focusing on carrying out operational practices on a routine basis”logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1073,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1073,logseq____&quot;^Flogseq____&quot;,1065,536870969]],[logseq____&quot;^15logseq____&quot;,[1073,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1073,logseq____&quot;^Vlogseq____&quot;,1066,536870969]],[logseq____&quot;^15logseq____&quot;,[1073,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1073,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1073,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-f56f-4ec8-acba-19d9ca136c96logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1074,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 32 - Platform teams need to be responsible for both development of the platform and the operations of it. This means that the platform must also abstract the operations side of app devs’ entire ops lifecycle. They shouldn’t ever need to do opslogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1074,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1074,logseq____&quot;^Flogseq____&quot;,1073,536870969]],[logseq____&quot;^15logseq____&quot;,[1074,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1074,logseq____&quot;^Vlogseq____&quot;,1066,536870969]],[logseq____&quot;^15logseq____&quot;,[1074,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1074,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1074,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-a72c-47cd-8882-4d35a44d8176logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1075,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 28 - Platform engineering metadata for primitives are usually found in specific systems (tag management systems, API/schema registries, internal developer portals). No consensus exists on the best info tracking methods at time of writing.\\n\\n---\\n\\nPlatform engineering metadata systems work best when all of the information is automatically populated and integrated into the platform itselflogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1075,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1075,logseq____&quot;^Flogseq____&quot;,1068,536870969]],[logseq____&quot;^15logseq____&quot;,[1075,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1075,logseq____&quot;^Vlogseq____&quot;,1066,536870969]],[logseq____&quot;^15logseq____&quot;,[1075,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1075,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1075,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-b355-4217-9e22-9ec64f6db0c0logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 44 - Expect anything and everything to go wrong when establishing a platform engineering team. Learn from the mistakes, and don’t make the same one twice.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Flogseq____&quot;,1078,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-1a26-4b49-b6a8-68f7bd8ec082logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 45 - When small teams are just starting out, there’s no need for any formality in tooling or knowledge sharing. If someone wants to know someone, they can just ask and someone will know.\\n\\n---\\n\\nFocus on CI/CD first for small projects and small teams. Just use off the shelf tooling. It gets the product to the customer the fastestlogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Flogseq____&quot;,1095,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-2ed6-4dc9-aff0-15ba2c7e414flogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 50-51 - You need better reasoning than efficiency when building platforms and teams. You need **leverage**.\\n\\nSometimes the leverage is the cost of too many ways to solve the same problem. If you can consolidate those to one solution, that’s a lot of overhead removed.\\n\\nBe careful though, sometimes company-wide standardization has no value but increases costs. Focus only on what brings value. If there’s continuous costs to maintain or onboard, don’t platformize it.\\n\\nIf there’s no real cost to onboard a project to a system, and not much maintainance cost, then it’s a good platform candidate.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Flogseq____&quot;,1085,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-863a-4f6e-bf9d-dc4f26f534e7logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 52-53 - Don’t hire product managers until the team is well established, and don’t hire projects managers for even longer. It’s preemptive until you actually deliver values.\\n\\nRule of thumb for both: the number of product managers should be between the number of team managers and the number of skip managers. Project managers should be about one for every 50 members of a team.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Flogseq____&quot;,1089,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-f8be-4a54-bc40-35ac88418a33logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 53-55 - This cross-cutting platform team section reminds me of hexagonal architecture (aka port and adapter architecture); build intakes (adapters), have public outputs (ports). And then I think about Conway’s Law (i.e. you ship your org chart).\\n\\nA team has outputs (code, binaries, container images, documents, etc). They also have inputs (requirements, dependencies, images, environment/tooling, etc). If we think about it this way, developer tooling in an analog to adapters for the tech side of things, and requirements documents and work tickets for the engineering side of things. The analog of ports would be the CI/CD pipelines which get the outputs to a known location.\\n\\nOpen source opens up the options for ports and adapters on the literal technology side of things. It doesn’t really do much for the engineering/planning/people side of things. That requires cultural shifts, I believe.\\n\\nRed Hat is interesting in that the culture is very bottom-up rather than top-down. The norms at Red Hat about how teams interface seem to make the process smoother. I should study those aspects more.\\n\\nWe have a HUGE discovery problem at Red Hat though. And that’s a place of opportunity for improvement.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Flogseq____&quot;,1086,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-5159-4a3d-801c-ad1d4deb848alogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 52 - When hiring senior engineers from big tech companies, be careful. Many come in with rigid ideas of what things ought to be like, without first considering the different contexts.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Flogseq____&quot;,1080,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-bbc0-454c-810b-43cd1d0eb9balogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 51-52 - New platform engineering teams will be tempted to bring in new technology, or start architecting everything. This is a trap that’ll lose goodwill, and doesn’t build trust with the app devs.\\n\\nInstead, focus on rapidly fixing problems that teams ACTUALLY have, find their pain points and fix them. Build systems piecewise, organize what exists, and deliverer value ASAP to build trust.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Flogseq____&quot;,1082,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-2806-4a53-8efa-3ebd71180c28logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 46-47 When the team and product grow and the complexity increases, the platform components begin to emerge.\\n\\nYou’ll know you’re here when you have a small DevOps group. **Don’t make a platform engineering team yet.**logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Flogseq____&quot;,1090,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-39a2-47e8-9a17-51eaf58d3f83logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 51 - The collective dynamic will be gone once centralization begins. It’s important to accept and be at peace with that. People WILL complain, so it’s important to have empathy for them.\\n\\nThis includes platform teams themselves. They can often get lost in the game and piss off the application developers. They should expect slow change. They **must** understand the application developers’ perspectives.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Flogseq____&quot;,1083,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-a39c-409b-9259-512e63258f38logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 43 - This chapter discusses the process of getting started with platform engineering, using three cases: a small startup, the process of transition to a platform as you grow, and converting traditional infrastructure into platform engineering (usually at big companies). \\n\\nQuestions I have going into this chapter after reading the opening:\\n\\nIn which ways do each section of this chapter apply to Red Hat? Red Hat is pretty culturally bottom up, like a start up. It reorgs all the time, so the transition phase is pretty common. And Red Hat IS big and a few decades old.\\n\\nMy answers ended up being:\\n\\nAt Red Hat, stage one (ad hoc tooling) can apply at up to smallish team level. Once you’re at the org level, you should be at stage two (somewhat managed).\\n\\nProof of concepts, research, etc. fall within stage one, so consider the tooling that’ll facilitate teamwork and development when handing the project off to the team.\\n\\nWhen a project becomes useful enough to for the rest of the org, then you should shoot for having the stage two elements either in place or nearly done.\\n\\nI originally thought that the transition phase would apply during an event of a reorg, but I didn’t immediately see an application.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Flogseq____&quot;,1094,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-736b-4584-98dc-427fa3e1bc14logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 49 - Medium teams should start more formal processes for changes. Good examples are RFCs and ADRs. Keep it lightweight though.\\n\\n---\\n\\nWhen do you know you’ve moved past the “somewhat managed” part of the platform engineering process?\\n\\nWhen you start seeing tools breaking repeatedly, and you see one failure which causes a cascade of failures\\n\\n---\\n\\nAlways consider how much change is ACTUALLY needed, and make sure to get buy-in from the team.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Flogseq____&quot;,1093,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-74c9-41f0-abb7-d03d688753bclogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1088,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;[[Notes]]logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1088,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1088,logseq____&quot;^Flogseq____&quot;,1091,536870970]],[logseq____&quot;^15logseq____&quot;,[1088,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1088,logseq____&quot;^Vlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1088,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1088,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1088,logseq____&quot;^Hlogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1088,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-236c-41a1-bb2d-67964584a4aelogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 53-55 - Horizontal cross-cutting platform engineering have additional concerns.\\n\\nConsider how you’ll interface with external business facing teams. They’ll over emphasize customer demands like UI if you don’t take careful considerations.\\n\\nHave a plan for everyone in the company to know your offerings. There’s lots of ways to get the word out. It’s marketing, basically.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Flogseq____&quot;,1081,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Vlogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a877cd4-cbb7-47e1-8fbe-d79a765fb195logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1090,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 47 - With medium teams, the question with tooling is “Is this core business?” If not, outsource the tooling.\\n\\n---\\n\\nYou’ll need to reconsider some initial tooling choices, especially if that tooling is niche and dev specific.\\n\\n---\\n\\nThis is the **ONLY** stage you should consider rewriting anything. It’s the only time where the returns on doing so make sense.\\n\\n---\\n\\nStart automating local developer environments. For example, you dev env setup in source with the product, containerize the local development stack, and using git hooks to update the dev environment on push/pull.logseq____&quot;,536870970]],[logs       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
