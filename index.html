). No consensus exists on the best info tracking methods at time of writing.\\n\\n---\\n\\nPlatform engineering metadata systems work best when all of the information is automatically populated and integrated into the platform itselflogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1058,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1058,logseq____&quot;^Flogseq____&quot;,1073,536870969]],[logseq____&quot;^15logseq____&quot;,[1058,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1058,logseq____&quot;^Vlogseq____&quot;,1063,536870969]],[logseq____&quot;^15logseq____&quot;,[1058,logseq____&quot;^Ulogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1058,logseq____&quot;^Ulogseq____&quot;,1044,536870969]],[logseq____&quot;^15logseq____&quot;,[1058,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a874df6-5c61-4539-a1ee-36c1d459313clogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1059,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 33 - Platform engineering teams are on the hook for user support regarding the platform, and should expect frequent questions and requests for help\\n\\n---\\n\\nPlatform teams must be proactive about abiding with operation discipline and best practices.\\n\\nWhat does “operation disciple” mean? According to the book, “Focusing on carrying out operational practices on a routine basis”logseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1059,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870969]],[logseq____&quot;^15logseq____&quot;,[1059,logseq____&quot;^Flogseq____&quot;,1069,536870969]],[logseq____&quot;^15logseq____&quot;,[1059,logseq____&quot;^Xlogseq____&quot;,42,536870969]],[logseq____&quot;^15logseq____&quot;,[1059,logseq____&quot;^Vlogseq____&quot;,1063,536870969]],[logseq____&quot;^15logseq____&quot;,[1059,logseq____&quot  the platform engineering process?\\n\\nWhen you start seeing tools breaking repeatedly, and you see one failure which causes a cascade of failures\\n\\n---\\n\\nAlways consider how much change is ACTUALLY needed, and make sure to get buy-in from the team.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Flogseq____&quot;,1095,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Vlogseq____&quot;,1094,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a874df6-e8c1-48be-b042-d8a11b5c366alogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 44 - Expect anything and everything to go wrong when establishing a platform engineering team. Learn from the mistakes, and don’t make the same one twice.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Flogseq____&quot;,1093,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Vlogseq____&quot;,1094,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a874df6-9f36-4068-aeed-6ca2531f3421logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 50-51 - You need better reasoning than efficiency when building platforms and teams. You need **leverage**.\\n\\nSometimes the leverage is the cost of too many ways to solve the same problem. If you can consolidate those to one solution, that’s a lot of overhead removed.\\n\\nBe careful though, sometimes company-wide standardization has no value but increases costs. Focus only on what brings value. If there’s continuous costs to maintain or onboard, don’t platformize it.\\n\\nIf there’s no real cost to onboard a project to a system, and not much maintainance cost, then it’s a good platform candidate.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Flogseq____&quot;,1083,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Vlogseq____&quot;,1094,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a874df6-ec4d-4ae8-bdf6-2d7e5849a8b7logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 53-55 - This cross-cutting platform team section reminds me of hexagonal architecture (aka port and adapter architecture); build intakes (adapters), have public outputs (ports). And then I think about Conway’s Law (i.e. you ship your org chart).\\n\\nA team has outputs (code, binaries, container images, documents, etc). They also have inputs (requirements, dependencies, images, environment/tooling, etc). If we think about it this way, developer tooling in an analog to adapters for the tech side of things, and requirements documents and work tickets for the engineering side of things. The analog of ports would be the CI/CD pipelines which get the outputs to a known location.\\n\\nOpen source opens up the options for ports and adapters on the literal technology side of things. It doesn’t really do much for the engineering/planning/people side of things. That requires cultural shifts, I believe.\\n\\nRed Hat is interesting in that the culture is very bottom-up rather than top-down. The norms at Red Hat about how teams interface seem to make the process smoother. I should study those aspects more.\\n\\nWe have a HUGE discovery problem at Red Hat though. And that’s a place of opportunity for improvement.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Flogseq____&quot;,1091,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Vlogseq____&quot;,1094,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a874df6-f42f-4835-bcb1-bbf394f76591logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 56-60 - I mostly skimmed this section, it didn’t seem immediately applicable. But I’ll return to it later one, I suspect it contains something interesting.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,lo ut I didn’t immediately see an application.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Flogseq____&quot;,1081,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Vlogseq____&quot;,1094,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^Ulogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1091,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a874df6-de85-419b-b6c3-569b6e0e2a92logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 46 - Consider **complexity**, **cost**, **scale**, and **lifespan** when picking off the shelf tooling for small teams. \\n\\nAlways ask if something is business differing vs core business. If it’s not either of these things, outsource it!\\n\\n---\\n\\nJust use a simple work/ticket tracker system for small teams. Don’t fret about agile ceremonies, you don’t need them at this point.\\n\\n---\\n\\nFor small teams, you get better returns through cooperation and getting everyone involved in the process rather than creating a dedicated platform engineering team.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Flogseq____&quot;,1088,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Vlogseq____&quot;,1094,536870970]],[logseq____&quot;^15logseq____&quot;,[1092,logseq____&quot;^Ulogseq____ ent to infrastructure organizations is now all the rage. But howlogseq____&apos;s that possible when infrastructure is still the operational layer of the company? This practical book guides engineers, managers, product managers, and leaders through the shifts that modern platform-led organizations require. Youlogseq____&apos;ll learn what platform engineering is--and isnlogseq____&apos;t--and what benefits and value it brings to developers and teams. Youlogseq____&apos;ll understand what it means to approach a platform as a product and learn some of the most common technical and managerial barriers to success. With this book, youlogseq____&apos;ll: Cultivate a platform-as-product, developer-centric mindset Learn what platform engineering teams are and are not Start the process of adopting platform engineering within your organization Discover what it takes to become a product manager for a platform team Understand the challenges that emerge when you scale platforms Automate processes and self-service infrastructure to speed development and improve developer experience Build out, hire, manage, and advocate for a platform team \\logseq____&quot;For the past 25 years, software organizations have grappled with a persistent challenge: how to manage code, tools, and infrastructure that is shared across multiple teams. Centralized teams often fall short--offering clunky systems, ignoring user needs, and failing to deliver stability and reliability. Some organizations have tried the other extreme, but the result is too often chaos, with small teams drowning in complexity. A select few have cracked the code by embracing a different approach: platform engineering. These teams create robust, user-friendly platforms to tame the beast of complexity, deliver leverage, and increase application team productivity. This practical book guides engineers, managers, product managers, and leaders through the shifts that modern platform-led organizations require. Youlogseq____&apos;ll lear       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
