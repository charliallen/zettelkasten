q____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[964,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 50-51 - You need better reasoning than efficiency when building platforms and teams. You need **leverage**.\\n\\nSometimes the leverage is the cost of too many ways to solve the same problem. If you can consolidate those to one solution, that’s a lot of overhead removed.\\n\\nBe careful though, sometimes company-wide standardization has no value but increases costs. Focus only on what brings value. If there’s continuous costs to maintain or onboard, don’t platformize it.\\n\\nIf there’s no real cost to onboard a project to a system, and not much maintainance cost, then it’s a good platform candidate.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[964,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[964,logseq____&quot;^Flogseq____&quot;,962,536870970]],[logseq____&quot;^15logseq____&quot;,[964,logseq____&quot;^Xlogseq____&quot;,32,536870970]],[logseq____&quot;^15logseq____&quot;,[964,logseq____&quot;^Vlogseq____&quot;,953,536870970]],[logseq____&quot;^15logseq____&quot;,[964,logseq____&quot;^Ulogseq____&quot;,32,536870970]],[logseq____&quot;^15logseq____&quot;,[964,logseq____&quot;^Ulogseq____&quot;,921,536870970]],[logseq____&quot;^15logseq____&quot;,[964,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a96e006-3f9e-4c14-9e12-1fc40af28fd8logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[965,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 47 - With medium teams, the question with tooling is “Is this core business?” If not, outsource the tooling.\\n\\n---\\n\\nYou’ll need to reconsider some initial tooling choices, especially if that tooling is niche and dev specific.\\n\\n---\\n\\nThis is the **ONLY** stage you should consider rewriting anything. It’s the only time where the returns on doing so make sense.\\n\\n---\\n\\nStart automating local developer environments. For example, you dev env setup in source with the product, containerize the local development stack, and using git hooks to update the dev environment on push/pull.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[965,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[965,logseq____&quot;^Flogseq____&quot;,958,536870970]],[logseq____&quot;^15logseq____&quot;,[965,logseq____&quot;^Xlogseq____&quot;,32,536870970]],[logseq____&quot;^15logseq____&quot;,[965,logseq____&quot;^Vlogseq____&quot;,953,536870970]],[logseq____&quot;^15logseq____&quot;,[965,logseq____&quot;^Ulogseq____&quot;,32,536870970]],[logseq____&quot;^15logseq____&quot;,[965,logseq____&quot;^Ulogseq____&quot;,921,536870970]],[logseq____&quot;^15logseq____&quot;,[965,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a96e006-424e-47b7-a21a-668238419132logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[966,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 43 - This chapter discusses the process of getting started with platform engineering, using three cases: a small startup, the process of transition to a platform as you grow, and converting traditional infrastructure into platform engineering (usually at big companies). \\n\\nQuestions I have going into this chapter after reading the opening:\\n\\nIn which ways do each section of this chapter apply to Red Hat? Red Hat is pretty culturally bottom up, like a start up. It reorgs all the time, so the transition phase is pretty common. And Red Hat IS big and a few decades old.\\n\\nMy answers ended up being:\\n\\nAt Red Hat, stage one (ad hoc tooling) can apply at up to smallish team level. Once you’re at the org level, you should be at stage two (somewhat managed).\\n\\nProof of concepts, research, etc. fall within stage one, so consider the tooling that’ll facilitate teamwork and development when handing the project off to the team.\\n\\nWhen a project becomes useful enough to for the rest of the org, then you should shoot for having the stage two elements either in place or nearly done.\\n\\nI originally thought that the transition phase would apply during an event of a reorg, but I didn’t immediately see an application.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[966,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[966,logseq____&quot;^Flogseq____&quot;,960,536870970]],[logseq____&quot;^15logseq____&quot;,[966,logseq____&quot;^Xlogseq____&quot;,32,536870970]],[logseq____&quot;^15logseq____&quot;,[966,logseq____&quot;^Vlogseq____&quot;,953,536870970]],[logseq____&quot;^15logseq____&quot;,[966,logseq____&quot;^Ulogseq____&quot;,32,536870970]],[logseq____&quot;^15logseq____&quot;,[966,logseq____&quot;^Ulogseq____&quot;,921,536870970]],[logseq____&quot;^15logseq____&quot;,[966,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a96e006-bb58-496e-b299-9459bc34c03blogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[967,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 53-55 - Horizontal cross-cutting platform engineering have additional concerns.\\n\\nConsider how you’ll interface with external business facing teams. They’ll over emphasize customer demands like UI if you don’t take careful considerations.\\n\\nHave a plan for everyone in the company to know your offerings. There’s lots of ways to get the word out. It’s marketing, basically.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[967,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[967,logseq____&quot;^Flogseq____&quot;,956,536870970]],[logseq____&quot;^15logseq____&quot;,[967,logseq____&quot;^Xlogseq____&quot;,32,536870970]],[logseq____&quot;^15logseq____&quot;,[967,logseq____&quot;^Vlogseq____&quot;,953,536870970]],[logs       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
