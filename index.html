 up. It reorgs all the time, so the transition phase is pretty common. And Red Hat IS big and a few decades old.\\n\\nMy answers ended up being:\\n\\nAt Red Hat, stage one (ad hoc tooling) can apply at up to smallish team level. Once you’re at the org level, you should be at stage two (somewhat managed).\\n\\nProof of concepts, research, etc. fall within stage one, so consider the tooling that’ll facilitate teamwork and development when handing the project off to the team.\\n\\nWhen a project becomes useful enough to for the rest of the org, then you should shoot for having the stage two elements either in place or nearly done.\\n\\nI originally thought that the transition phase would apply during an event of a reorg, but I didn’t immediately see an application.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Flogseq____&quot;,1070,536870970]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Vlogseq____&quot;,1072,536870970]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^Ulogseq____&quot;,1038,536870970]],[logseq____&quot;^15logseq____&quot;,[1068,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8dddde-3e18-41ac-bf11-7c33d34669c4logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 51-52 - New platform engineering teams will be tempted to bring in new technology, or start architecting everything. This is a trap that’ll lose goodwill, and doesn’t build trust with the app devs.\\n\\nInstead, focus on rapidly fixing problems that teams ACTUALLY have, find their pain points and fix them. Build systems piecewise, organize what exists, and deliverer value ASAP to build trust.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Flogseq____&quot;,1082,536870970]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Vlogseq____&quot;,1072,536870970]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^Ulogseq____&quot;,1038,536870970]],[logseq____&quot;^15logseq____&quot;,[1069,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8dddde-8096-4bf4-8a0d-4d10f708aa80logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 56-60 - I mostly skimmed this section, it didn’t seem immediately applicable. But I’ll return to it later one, I suspect it contains something interesting.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Flogseq____&quot;,1072,536870970]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Vlogseq____&quot;,1072,536870970]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^Ulogseq____&quot;,1038,536870970]],[logseq____&quot;^15logseq____&quot;,[1070,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8dddde-be00-4d02-bbc6-971d78655ce6logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 49 - Medium teams should start more formal processes for changes. Good examples are RFCs and ADRs. Keep it lightweight though.\\n\\n---\\n\\nWhen do you know you’ve moved past the “somewhat managed” part of the platform engineering process?\\n\\nWhen you start seeing tools breaking repeatedly, and you see one failure which causes a cascade of failures\\n\\n---\\n\\nAlways consider how much change is ACTUALLY needed, and make sure to get buy-in from the team.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Flogseq____&quot;,1080,536870970]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Vlogseq____&quot;,1072,536870970]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^Ulogseq____&quot;,1038,536870970]],[logseq____&quot;^15logseq____&quot;,[1071,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8dddde-7713-4d94-9bf0-796d00fcfa27logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;[[Notes]]logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Flogseq____&quot;,1077,536870970]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Vlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1072,logseq____&quot;^Ulogseq____&quot;,1038,536870970]],[logseq____&quot;^15logseq____&quot;,[1072,logseq_  careful though, sometimes company-wide standardization has no value but increases costs. Focus only on what brings value. If there’s continuous costs to maintain or onboard, don’t platformize it.\\n\\nIf there’s no real cost to onboard a project to a system, and not much maintainance cost, then it’s a good platform candidate.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Flogseq____&quot;,1085,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Vlogseq____&quot;,1072,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Ulogseq____&quot;,1038,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8dddde-226d-439c-a0d3-4329e3f6adeclogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 52 - When hiring senior engineers from big tech companies, be careful. Many come in with rigid ideas of what things ought to be like, without first considering the different contexts.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Flogseq____&quot;,1076,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Vlogseq____&quot;,1072,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Ulogseq____&quot;,1038,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8dddde-bbaf-43b4-8484-e4dd2d92ebfalogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 48 - With medium teams, you need better QA gating. Consider measuring test coverage as part of CI. Shoot for “no tests, no merge” and never merge failing code. Use branch-based deployments.\\n\\n---\\n\\nMedium teams should have observability in place already, not just DevOps, but  application data as well. Try to extend existing tooling to link the systems.\\n\\n(Platform Observability, Appplication Observibility) -logseq____&gt; Linked Observability system\\n\\n---\\n\\nMedium teams should have automation in place already. Build on that tooling to manage production, and leverage it for other environments too.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Flogseq____&quot;,1071,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Vlogseq____&quot;,1072,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Ulogseq____&quot;,1038,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8dddde-9981-4ca0-856f-94aaf9676e65logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 53-55 - This cross-cutting platform team section reminds me of hexagonal architecture (aka port and adapter architecture); build intakes (adapters), have public outputs (ports). And then I think about Conway’s Law (i.e. you ship your org chart).\\n\\nA team has outputs (code, binaries, container images, documents, etc). They also have inputs (requirements, dependencies, images, environment/tooling, etc). If we think about it this way, developer tooling in an analog to adapters for the tech side of things, and requirements documents and work tickets for the engineering side of things. The analog of ports would be the CI/CD pipelines which get the outputs to a known location.\\n\\nOpen source opens up the options for ports and adapters on the literal technology side of things. It doesn’t really do much for the engineering/planning/people side of things. That requires cultural shifts, I believe.\\n\\nRed Hat is interesting in that the culture is very bottom-up rather than top-down. The norms at Red Hat about how teams interface seem to make the process smoother. I should study those aspects more.\\n\\nWe have a HUGE discovery problem at Red Hat though. And that’s a place of opportunity for improvement.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Klogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Flogseq____&quot;,1068,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Vlogseq____&quot;,1072,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Ulogseq____&quot;,1038,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8dddde-f6fa-41e7-aa2b-7e96a9b87b2alogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 51 - The collective dynamic will be gone once centralization begins. It’s important to accept and be at peace with th       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
