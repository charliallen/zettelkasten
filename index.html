seq____&quot;,[1077,logseq____&quot;^Hlogseq____&quot;,1044,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Hlogseq____&quot;,1045,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^Hlogseq____&quot;,1046,536870970]],[logseq____&quot;^15logseq____&quot;,[1077,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-90f3-4fa4-aa47-d85b1ae838balogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 46 - Consider **complexity**, **cost**, **scale**, and **lifespan** when picking off the shelf tooling for small teams. \\n\\nAlways ask if something is business differing vs core business. If it’s not either of these things, outsource it!\\n\\n---\\n\\nJust use a simple work/ticket tracker system for small teams. Don’t fret about agile ceremonies, you don’t need them at this point.\\n\\n---\\n\\nFor small teams, you get better returns through cooperation and getting everyone involved in the process rather than creating a dedicated platform engineering team.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Flogseq____&quot;,1094,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1078,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-736c-4dd7-a0d0-01bd772c5e37logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;[[Notes]]logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Flogseq____&quot;,1077,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Vlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^Hlogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1079,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-221d-49bc-baf2-0e2b6177d19elogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 47 - With medium teams, the question with tooling is “Is this core business?” If not, outsource the tooling.\\n\\n---\\n\\nYou’ll need to reconsider some initial tooling choices, especially if that tooling is niche and dev specific.\\n\\n---\\n\\nThis is the **ONLY** stage you should consider rewriting anything. It’s the only time where the returns on doing so make sense.\\n\\n---\\n\\nStart automating local developer environments. For example, you dev env setup in source with the product, containerize the local development stack, and using git hooks to update the dev environment on push/pull.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Flogseq____&quot;,1076,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1080,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-2d6c-4b8a-bbe9-786d184bbd82logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 45 - When small teams are just starting out, there’s no need for any formality in tooling or knowledge sharing. If someone wants to know someone, they can just ask and someone will know.\\n\\n---\\n\\nFocus on CI/CD first for small projects and small teams. Just use off the shelf tooling. It gets the product to the customer the fastestlogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Flogseq____&quot;,1078,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1081,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-4ba7-4823-b023-6d6449879baclogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 53-55 - Horizontal cross-cutting platform engineering have additional concerns.\\n\\nConsider how you’ll interface with external business facing teams. They’ll over emphasize customer demands like UI if you don’t take careful considerations.\\n\\nHave a plan for everyone in the company to know your offerings. There’s lots of ways to get the word out. It’s marketing, basically.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Flogseq____&quot;,1089,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1082,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-18d1-4bbc-bbf3-f8aec5f20807logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 43 - This chapter discusses the process of getting started with platform engineering, using three cases: a small startup, the process of transition to a platform as you grow, and converting traditional infrastructure into platform engineering (usually at big companies). \\n\\nQuestions I have going into this chapter after reading the opening:\\n\\nIn which ways do each section of this chapter apply to Red Hat? Red Hat is pretty culturally bottom up, like a start up. It reorgs all the time, so the transition phase is pretty common. And Red Hat IS big and a few decades old.\\n\\nMy answers ended up being:\\n\\nAt Red Hat, stage one (ad hoc tooling) can apply at up to smallish team level. Once you’re at the org level, you should be at stage two (somewhat managed).\\n\\nProof of concepts, research, etc. fall within stage one, so consider the tooling that’ll facilitate teamwork and development when handing the project off to the team.\\n\\nWhen a project becomes useful enough to for the rest of the org, then you should shoot for having the stage two elements either in place or nearly done.\\n\\nI originally thought that the transition phase would apply during an event of a reorg, but I didn’t immediately see an application.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Flogseq____&quot;,1092,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1083,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-a070-4e5d-945e-0f35df8fa6f9logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 51-52 - New platform engineering teams will be tempted to bring in new technology, or start architecting everything. This is a trap that’ll lose goodwill, and doesn’t build trust with the app devs.\\n\\nInstead, focus on rapidly fixing problems that teams ACTUALLY have, find their pain points and fix them. Build systems piecewise, organize what exists, and deliverer value ASAP to build trust.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Flogseq____&quot;,1091,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1084,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-44cd-4c6b-853f-377bed34d1c0logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 50 - When do we start creating platform teams? The book suggests it’s we start getting throttled by Dunbar’s number.\\n\\n---\\n\\nNew platform teams struggle initially. The cooperative groups still have existing habits, and centralized teams create interpersonal conflicts.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Flogseq____&quot;,1087,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1085,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-ba1b-4da2-912e-fb60624dc02blogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 51 - The collective dynamic will be gone once centralization begins. It’s important to accept and be at peace with that. People WILL complain, so it’s important to have empathy for them.\\n\\nThis includes platform teams themselves. They can often get lost in the game and piss off the application developers. They should expect slow change. They **must** understand the application developers’ perspectives.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Flogseq____&quot;,1084,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1086,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-9d37-4cc0-9b53-0857992646b0logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 50-51 - You need better reasoning than efficiency when building platforms and teams. You need **leverage**.\\n\\nSometimes the leverage is the cost of too many ways to solve the same problem. If you can consolidate those to one solution, that’s a lot of overhead removed.\\n\\nBe careful though, sometimes company-wide standardization has no value but increases costs. Focus only on what brings value. If there’s continuous costs to maintain or onboard, don’t platformize it.\\n\\nIf there’s no real cost to onboard a project to a system, and not much maintainance cost, then it’s a good platform candidate.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Flogseq____&quot;,1086,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1087,logseq____&quot;^Ulogseq____&quot;,1043,536870970 pens up the options for ports and adapters on the literal technology side of things. It doesn’t really do much for the engineering/planning/people side of things. That requires cultural shifts, I believe.\\n\\nRed Hat is interesting in that the culture is very bottom-up rather than top-down. The norms at Red Hat about how teams interface seem to make the process smoother. I should study those aspects more.\\n\\nWe have a HUGE discovery problem at Red Hat though. And that’s a place of opportunity for improvement.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Flogseq____&quot;,1083,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Xlogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Vlogseq____&quot;,1079,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Ulogseq____&quot;,20,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^Ulogseq____&quot;,1043,536870970]],[logseq____&quot;^15logseq____&quot;,[1089,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a873f79-6d7c-45d7-8e41-65460c0df46flogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1090,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;pg 52-53 - Don’t hire product managers until the team is well established, and don’t hire projects managers for even longer. It’s preemptive until you actually deliver values.\\n\\nRule of thumb for both: the number of product managers should be between the number of team managers and the number of skip managers. Project managers should be about one for every 50 members of a team.logseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1090,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^1Ilogseq____&quot;,536870970]],[logseq____&quot;^15logseq____&quot;,[1090,logseq____&quot;^Flog       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
